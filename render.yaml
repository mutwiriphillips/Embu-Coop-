# Render Blueprint — Embu Coop Management & Governance System (pilot/test run)
#
# Deploy: push this repo to GitHub, then in Render choose
# "New +" -> "Blueprint" and point it at the repo. Render reads this file
# and provisions all three services together.
#
# After the first deploy, run the pilot seed once via the backend service's
# Shell tab: node prisma/seed-pilot.js  (see RENDER_DEPLOYMENT.md)

databases:
  - name: embu-coop-db
    # WARNING: free Postgres expires after 30 days and cannot be recovered.
    # Upgrade to a paid plan before real data goes in, and see "Backups and
    # recovery" in RENDER_DEPLOYMENT.md.
    plan: free
    databaseName: embu_coop_system
    user: embu_admin

services:
  - type: web
    name: embu-coop-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --omit=optional && npx prisma generate && npx prisma db push
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: embu-coop-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://embu-coop-frontend.onrender.com
      # Pilot: "false" keeps the published pilot passwords working. Set "true"
      # at full launch (forced password change, two-step sign-in for admins,
      # strict password rules). See SECURITY_ASSESSMENT.md.
      - key: SECURITY_HARDENING
        value: "false"
      # Open self-signup lets anyone on the internet create a county account.
      # Keep "false". (Turn on only briefly for a supervised test.)
      - key: ALLOW_OPEN_SIGNUP
        value: "false"
      # 1/3 gender rule: "false" = measured and flagged but not blocked.
      # Change to "true" (and redeploy) when enforcement starts.
      - key: ENFORCE_GENDER_RULE
        value: "false"

  - type: web
    name: embu-coop-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://embu-coop-backend.onrender.com/api
