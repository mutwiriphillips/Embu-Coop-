version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: embu_admin
      POSTGRES_PASSWORD: embu_password
      POSTGRES_DB: embu_coop_system
    ports:
      - "127.0.0.1:5432:5432"   # local only: never expose this dev database to a network
    volumes:
      - embu_pg_data:/var/lib/postgresql/data

volumes:
  embu_pg_data:
