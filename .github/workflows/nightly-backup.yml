# Nightly encrypted copy of the production database, kept as a private GitHub
# artifact for 30 days. This is the safety net if Render ever suspends or
# loses the database.
#
# One-time setup (repo Settings -> Secrets and variables -> Actions):
#   BACKUP_DATABASE_URL  the database's EXTERNAL connection string from Render
#   BACKUP_PASSPHRASE    a long random passphrase (store it in a password manager;
#                        without it the backups cannot be opened)
# The repository MUST be private. Then run it once from the Actions tab
# ("Run workflow") to confirm it works.
#
# Restore: decrypt, then `pg_restore` into a new database (see RENDER_DEPLOYMENT.md).
name: Nightly database backup

on:
  schedule:
    - cron: "30 20 * * *"   # 23:30 Nairobi time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 16 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16

      - name: Dump and encrypt
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_DATABASE_URL" || { echo "BACKUP_DATABASE_URL secret is not set"; exit 1; }
          test -n "$BACKUP_PASSPHRASE"   || { echo "BACKUP_PASSPHRASE secret is not set"; exit 1; }
          umask 077
          F="embu-coop-$(date -u +%Y-%m-%d-%H%M).dump"
          /usr/lib/postgresql/16/bin/pg_dump --format=custom --no-owner --no-acl "$BACKUP_DATABASE_URL" -f "$F"
          # a dump with no tables means something is wrong; do not keep it
          test "$(/usr/lib/postgresql/16/bin/pg_restore --list "$F" | grep -c 'TABLE DATA')" -ge 10
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSPHRASE -in "$F" -out "$F.enc"
          rm "$F"
          ls -l "$F.enc"
          echo "FILE=$F.enc" >> "$GITHUB_ENV"

      - name: Keep the encrypted file
        uses: actions/upload-artifact@v4
        with:
          name: embu-coop-db-backup
          path: ${{ env.FILE }}
          retention-days: 30
          if-no-files-found: error
